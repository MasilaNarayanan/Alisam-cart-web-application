<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head>
    <title>Login - Alisam Cart</title>
</head>
<body>
<main layout:fragment="content">

    <div class="min-h-[80vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 relative overflow-hidden bg-gradient-to-br from-indigo-50 via-white to-pink-50">
        <!-- Background Elements -->
        <div class="absolute top-0 right-0 -mr-20 -mt-20 w-96 h-96 rounded-full bg-primary/20 blur-3xl pointer-events-none"></div>
        <div class="absolute bottom-0 left-0 -ml-20 -mb-20 w-96 h-96 rounded-full bg-secondary/20 blur-3xl pointer-events-none"></div>

        <div class="max-w-md w-full relative z-10">
            <div class="bg-white/90 backdrop-blur-xl rounded-3xl shadow-xl border border-slate-100 p-8 sm:p-10 transform transition-all duration-500 translate-y-0 hover:-translate-y-1 hover:shadow-2xl">
                
                <div class="text-center mb-8">
                    <div class="w-16 h-16 bg-gradient-to-tr from-primary to-secondary rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-[0_8px_20px_rgba(99,102,241,0.4)] transform -rotate-6 hover:rotate-0 transition-all duration-300">
                        <i class="fas fa-print text-2xl text-white"></i>
                    </div>
                    <h2 class="text-3xl font-extrabold text-slate-900 mb-2">Welcome Back!</h2>
                    <p class="text-slate-500 font-medium">Sign in to continue customizing &amp; ordering</p>
                </div>

                <form th:action="@{/login}" method="post" id="loginForm" class="space-y-6">
                    <div>
                        <label for="email" class="block text-sm font-bold text-slate-700 mb-2">Email Address</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i class="fas fa-envelope text-slate-400"></i>
                            </div>
                            <input type="email" id="email" name="email" class="w-full pl-11 bg-slate-50 border border-slate-200 text-slate-900 text-sm rounded-xl focus:ring-primary focus:border-primary block p-3.5 transition-colors outline-none" placeholder="you@example.com" required>
                        </div>
                    </div>
                    
                    <div>
                        <label for="password" class="block text-sm font-bold text-slate-700 mb-2">Password</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i class="fas fa-lock text-slate-400"></i>
                            </div>
                            <input type="password" id="password" name="password" class="w-full pl-11 bg-slate-50 border border-slate-200 text-slate-900 text-sm rounded-xl focus:ring-primary focus:border-primary block p-3.5 transition-colors outline-none" placeholder="••••••••" required>
                        </div>
                    </div>

                    <div class="flex items-center justify-between text-sm">
                        <label class="flex items-center gap-2 cursor-pointer group">
                            <input type="checkbox" class="w-4 h-4 text-primary border-slate-300 rounded focus:ring-primary transition-colors">
                            <span class="font-medium text-slate-600 group-hover:text-slate-900 transition-colors">Remember me</span>
                        </label>
                        <a href="#" class="font-bold text-primary hover:text-primaryHover transition-colors">Forgot Password?</a>
                    </div>

                    <div th:if="${param.error}" class="bg-rose-50 border border-rose-100 text-rose-600 px-4 py-3 rounded-xl text-sm font-medium flex items-center gap-2">
                        <i class="fas fa-circle-exclamation text-rose-500"></i> Invalid email or password. Please try again.
                    </div>

                    <button type="submit" class="w-full flex justify-center items-center gap-2 px-8 py-4 text-base font-bold text-white transition-all bg-gradient-to-r from-primary to-primaryHover hover:from-primaryHover hover:to-primary border border-transparent rounded-xl shadow-[0_4px_14px_0_rgba(99,102,241,0.39)] hover:shadow-[0_6px_20px_rgba(99,102,241,0.23)] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transform hover:-translate-y-0.5">
                        Sign In <i class="fas fa-arrow-right ml-1"></i>
                    </button>
                </form>

                <div class="mt-8 mb-6 relative flex items-center justify-center">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-slate-200"></div>
                    </div>
                    <span class="relative bg-white px-4 text-xs font-semibold text-slate-400 uppercase tracking-widest">or continue with</span>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <a href="/oauth2/authorization/google" class="flex items-center justify-center gap-2 px-4 py-3 bg-white border border-slate-200 text-slate-700 text-sm font-bold rounded-xl hover:bg-slate-50 transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-200 shadow-sm">
                        <i class="fab fa-google text-[#EA4335] text-lg"></i> Google
                    </a>
                    <button class="flex items-center justify-center gap-2 px-4 py-3 bg-white border border-slate-200 text-slate-700 text-sm font-bold rounded-xl hover:bg-slate-50 transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-200 shadow-sm">
                        <i class="fab fa-facebook-f text-[#1877F2] text-lg cursor-pointer"></i> Facebook
                    </button>
                </div>

                <div class="mt-8 text-center text-sm font-medium text-slate-600">
                    Don't have an account? <a href="/register" class="font-bold text-primary hover:text-primaryHover transition-colors hover:underline underline-offset-2">Create one free <i class="fas fa-arrow-right ml-1 text-xs"></i></a>
                </div>
            </div>
        </div>
    </div>

</main>
</body>
</html>
