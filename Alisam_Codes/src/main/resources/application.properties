spring.application.name=Alisam_Codes

# Load environment variables from .env if present
spring.config.import=optional:file:.env[.properties]

# ✅ Correct JDBC URL format
spring.datasource.url=jdbc:mysql://mysql-a82128-nmasilamani615-b762.j.aivencloud.com:16302/defaultdb?sslMode=REQUIRED

spring.datasource.username=avnadmin
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#server.address=192.168.1.1
server.port=8383

# JPA Settings
debug=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# File upload limits
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Session & Frontend Settings
spring.session.jdbc.initialize-schema=always
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Google OAuth2 Credentials
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile, email

# Razorpay Payment Gateway Keys (Test Mode)
razorpay.key.id=rzp_test_dummyKeyId12345
razorpay.key.secret=dummySecretKey67890
