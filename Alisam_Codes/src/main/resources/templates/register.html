<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{fragments/layout}">
<head>
    <title>Alisam Cart - Register</title>
</head>
<body>
    <main layout:fragment="content">
        <div class="min-h-[80vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 relative overflow-hidden bg-gradient-to-tl from-pink-50 via-white to-indigo-50">
            <!-- Background Elements -->
            <div class="absolute top-0 left-0 -ml-20 -mt-20 w-96 h-96 rounded-full bg-primary/20 blur-3xl pointer-events-none"></div>
            <div class="absolute bottom-0 right-0 -mr-20 -mb-20 w-96 h-96 rounded-full bg-secondary/20 blur-3xl pointer-events-none"></div>

            <div class="max-w-md w-full relative z-10 slide-up">
                <div class="bg-white/90 backdrop-blur-xl rounded-3xl shadow-xl border border-slate-100 p-8 sm:p-10 transform transition-all duration-500 hover:shadow-2xl">
                    
                    <div class="text-center mb-8">
                        <div class="w-16 h-16 bg-gradient-to-bl from-primary to-secondary rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-[0_8px_20px_rgba(99,102,241,0.4)] transform rotate-6 hover:rotate-0 transition-all duration-300">
                            <i class="fas fa-user-plus text-2xl text-white"></i>
                        </div>
                        <h2 class="text-3xl font-extrabold text-slate-900 mb-2">Create an Account</h2>
                        <p class="text-slate-500 font-medium text-sm">Join Alisam Cart to start creating personalized merchandise.</p>
                    </div>

                    <form th:action="@{/register}" method="post" class="space-y-5">
                        <div>
                            <label for="name" class="block text-sm font-bold text-slate-700 mb-1.5"><i class="fas fa-user text-slate-400 mr-1"></i> Full Name</label>
                            <input type="text" id="name" name="name" class="w-full bg-slate-50 border border-slate-200 text-slate-900 text-sm rounded-xl focus:ring-primary focus:border-primary block p-3 transition-colors outline-none" required placeholder="John Doe">
                        </div>

                        <div>
                            <label for="email" class="block text-sm font-bold text-slate-700 mb-1.5"><i class="fas fa-envelope text-slate-400 mr-1"></i> Email Address</label>
                            <input type="email" id="email" name="email" class="w-full bg-slate-50 border border-slate-200 text-slate-900 text-sm rounded-xl focus:ring-primary focus:border-primary block p-3 transition-colors outline-none" required placeholder="name@example.com">
                        </div>
                        
                        <div>
                            <label for="password" class="block text-sm font-bold text-slate-700 mb-1.5"><i class="fas fa-lock text-slate-400 mr-1"></i> Password</label>
                            <input type="password" id="password" name="password" class="w-full bg-slate-50 border border-slate-200 text-slate-900 text-sm rounded-xl focus:ring-primary focus:border-primary block p-3 transition-colors outline-none" required placeholder="••••••••">
                        </div>
                        
                        <div>
                            <label for="confirm_password" class="block text-sm font-bold text-slate-700 mb-1.5"><i class="fas fa-lock text-slate-400 mr-1"></i> Confirm Password</label>
                            <input type="password" id="confirm_password" name="confirm_password" class="w-full bg-slate-50 border border-slate-200 text-slate-900 text-sm rounded-xl focus:ring-primary focus:border-primary block p-3 transition-colors outline-none" required placeholder="••••••••">
                        </div>

                        <div class="pt-2 flex items-start">
                            <div class="flex items-center h-5">
                                <input id="terms" type="checkbox" required class="w-4 h-4 text-primary border-slate-300 rounded focus:ring-primary transition-colors cursor-pointer mt-0.5">
                            </div>
                            <div class="ml-2 text-sm">
                                <label for="terms" class="font-medium text-slate-600 cursor-pointer hover:text-slate-900 transition-colors">I agree to the <a href="#" class="font-bold text-primary hover:text-primaryHover hover:underline">Terms & Conditions</a></label>
                            </div>
                        </div>

                        <button type="submit" class="w-full mt-6 flex justify-center items-center gap-2 px-8 py-4 text-base font-bold text-white transition-all bg-gradient-to-r from-primary to-primaryHover hover:from-primaryHover hover:to-primary border border-transparent rounded-xl shadow-[0_4px_14px_0_rgba(99,102,241,0.39)] hover:-translate-y-0.5 hover:shadow-[0_6px_20px_rgba(99,102,241,0.23)] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transform hover:-translate-y-0.5">
                            Register <i class="fas fa-arrow-right ml-1"></i>
                        </button>
                    </form>

                    <div class="mt-8 mb-6 relative flex items-center justify-center">
                        <div class="absolute inset-0 flex items-center">
                            <div class="w-full border-t border-slate-200"></div>
                        </div>
                        <span class="relative bg-white px-4 text-xs font-semibold text-slate-400 uppercase tracking-widest">or</span>
                    </div>
                    
                    <a href="/oauth2/authorization/google" class="w-full flex justify-center items-center gap-2 mb-6 px-4 py-3 bg-white border border-slate-200 text-slate-700 text-sm font-bold rounded-xl hover:bg-slate-50 transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-200 shadow-sm">
                        <i class="fab fa-google text-[#EA4335] text-lg"></i> Register with Google
                    </a>
                    
                    <div class="text-center text-sm font-medium text-slate-600">
                        Already have an account? <a href="/login" class="font-bold text-primary hover:text-primaryHover transition-colors hover:underline underline-offset-2">Log In instead <i class="fas fa-arrow-right ml-1 text-xs"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
