<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Managers - Admin Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-900">

    <div class="flex h-screen overflow-hidden">
        
        <!-- Sidebar -->
        <aside class="w-64 bg-gray-900 text-white flex flex-col">
            <div class="p-6 text-2xl font-black text-center tracking-widest border-b border-gray-800">
                ALISAM CART<span class="text-[#ffa41c]">.</span>
                <div class="text-[10px] text-gray-400 font-normal tracking-normal mt-1">Admin Portal</div>
            </div>
            <nav class="flex-1 px-4 py-6 space-y-2">
                <a href="/admin" class="flex items-center gap-3 text-gray-300 hover:bg-gray-800 hover:text-white px-4 py-3 rounded-lg font-medium transition-colors">
                    <i class="fas fa-tachometer-alt"></i> Dashboard
                </a>
                <a href="/admin/products" class="flex items-center gap-3 text-gray-300 hover:bg-gray-800 hover:text-white px-4 py-3 rounded-lg font-medium transition-colors">
                    <i class="fas fa-box"></i> Products
                </a>
                <a href="/admin/managers" class="flex items-center gap-3 bg-[#ffa41c] text-gray-900 px-4 py-3 rounded-lg font-bold transition-colors">
                    <i class="fas fa-users-cog"></i> Managers
                </a>
            </nav>
            <div class="p-4 border-t border-gray-800">
                <a href="/" class="flex items-center gap-3 text-gray-400 hover:text-white transition-colors text-sm">
                    <i class="fas fa-sign-out-alt"></i> Back to Store
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col overflow-y-auto">
            
            <header class="bg-white shadow-sm px-8 py-4 flex justify-between items-center sticky top-0 z-10">
                <h1 class="text-xl font-bold text-gray-800">Managers</h1>
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-full bg-gray-200 border-2 border-[#ffa41c] overflow-hidden">
                        <img src="https://ui-avatars.com/api/?name=Admin&background=ffa41c&color=fff" alt="Admin">
                    </div>
                </div>
            </header>

            <div class="p-8">
                
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold">Total Managers</h2>
                    <a href="/admin/managers/new" class="bg-[#ffa41c] hover:bg-[#e08b10] text-gray-900 px-6 py-2 rounded-lg font-bold shadow transition-colors">
                        + Add Manager
                    </a>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-50 border-b border-gray-100 text-sm text-gray-500 uppercase tracking-wider">
                                <th class="p-4 font-semibold">ID</th>
                                <th class="p-4 font-semibold">Name</th>
                                <th class="p-4 font-semibold">Email</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-100">
                            <tr th:each="manager : ${managers}" class="hover:bg-gray-50 transition-colors">
                                <td class="p-4 text-sm font-medium text-gray-900" th:text="${manager.id}">1</td>
                                <td class="p-4 text-sm font-bold text-gray-900" th:text="${manager.name}">Manager Name</td>
                                <td class="p-4 text-sm text-gray-500" th:text="${manager.email}">manager@example.com</td>
                            </tr>
                            <tr th:if="${managers == null or managers.isEmpty()}">
                                <td colspan="3" class="p-8 text-center text-gray-500">No managers found. Set user role to 'MANAGER' in DB to add one.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </main>
    </div>
</body>
</html>
