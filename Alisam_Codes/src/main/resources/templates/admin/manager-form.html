<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Manager - Admin Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-900">

    <div class="flex h-screen overflow-hidden">
        
        <!-- Sidebar -->
        <aside class="w-64 bg-gray-900 text-white flex flex-col">
            <div class="p-6 text-2xl font-black text-center tracking-widest border-b border-gray-800">
                ALISAM CART<span class="text-[#ffa41c]">.</span>
                <div class="text-[10px] text-gray-400 font-normal tracking-normal mt-1">Admin Portal</div>
            </div>
            <nav class="flex-1 px-4 py-6 space-y-2">
                <a href="/admin" class="flex items-center gap-3 text-gray-300 hover:bg-gray-800 hover:text-white px-4 py-3 rounded-lg font-medium transition-colors">
                    <i class="fas fa-tachometer-alt"></i> Dashboard
                </a>
                <a href="/admin/products" class="flex items-center gap-3 text-gray-300 hover:bg-gray-800 hover:text-white px-4 py-3 rounded-lg font-medium transition-colors">
                    <i class="fas fa-box"></i> Products
                </a>
                <a href="/admin/managers" class="flex items-center gap-3 bg-[#ffa41c] text-gray-900 px-4 py-3 rounded-lg font-bold transition-colors">
                    <i class="fas fa-users-cog"></i> Managers
                </a>
            </nav>
            <div class="p-4 border-t border-gray-800">
                <a href="/" class="flex items-center gap-3 text-gray-400 hover:text-white transition-colors text-sm">
                    <i class="fas fa-sign-out-alt"></i> Back to Store
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col overflow-y-auto">
            
            <header class="bg-white shadow-sm px-8 py-4 flex justify-between items-center sticky top-0 z-10">
                <div class="flex items-center gap-4">
                    <a href="/admin/managers" class="w-8 h-8 flex items-center justify-center rounded-full bg-gray-100 hover:bg-gray-200 text-gray-600 transition-colors">
                        <i class="fas fa-arrow-left"></i>
                    </a>
                    <h1 class="text-xl font-bold text-gray-800">Create New Manager</h1>
                </div>
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-full bg-gray-200 border-2 border-[#ffa41c] overflow-hidden">
                        <img src="https://ui-avatars.com/api/?name=Admin&background=ffa41c&color=fff" alt="Admin">
                    </div>
                </div>
            </header>

            <div class="p-8">
                
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 max-w-2xl mx-auto overflow-hidden">
                    <div class="p-6 border-b border-gray-100 bg-gray-50 flex items-center gap-3">
                        <div class="w-10 h-10 rounded-lg bg-orange-100 text-orange-600 flex items-center justify-center font-bold text-lg shadow-sm">
                            <i class="fas fa-user-plus"></i>
                        </div>
                        <h2 class="text-xl font-bold text-gray-800">Assign New Manager</h2>
                    </div>
                    
                    <form th:action="@{/admin/managers/add}" th:object="${user}" method="post" class="p-8 space-y-6">
                        
                        <div th:if="${error}" class="bg-red-50 text-red-500 p-4 rounded-lg flex items-center gap-3 shadow-sm border border-red-100">
                            <i class="fas fa-exclamation-circle"></i>
                            <span th:text="${error}"></span>
                        </div>
                        
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-2">Full Name</label>
                                <input type="text" th:field="*{name}" required class="w-full border border-gray-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-[#ffa41c] focus:border-[#ffa41c] outline-none transition-all placeholder-gray-400" placeholder="e.g. John Doe">
                            </div>
                            
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-2">Email Address</label>
                                <input type="email" th:field="*{email}" required class="w-full border border-gray-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-[#ffa41c] focus:border-[#ffa41c] outline-none transition-all placeholder-gray-400" placeholder="e.g. manager@alisamcart.com">
                            </div>
                            
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
                                <input type="password" th:field="*{password}" required class="w-full border border-gray-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-[#ffa41c] focus:border-[#ffa41c] outline-none transition-all placeholder-gray-400" placeholder="Enter a secure password">
                                <p class="text-xs text-gray-500 mt-2"><i class="fas fa-info-circle mr-1"></i> Manager will use this email and password to access the Manager Portal.</p>
                            </div>
                        </div>

                        <div class="pt-6 border-t border-gray-100 flex gap-4">
                            <button type="submit" class="bg-gray-900 hover:bg-black text-white px-8 py-3 rounded-lg font-bold shadow-md transition-colors flex items-center gap-2">
                                <i class="fas fa-check"></i> Create Manager Account
                            </button>
                            <a href="/admin/managers" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-6 py-3 rounded-lg font-bold transition-colors">
                                Cancel
                            </a>
                        </div>
                    </form>
                </div>

            </div>
        </main>
    </div>
</body>
</html>
